# ============================================================
# duckdb-gpu 统一路径配置
# ============================================================
# 全仓库唯一的机器相关配置。换机器时只需要改这一行。
#
# base_dir = duckdb-gpu 仓库根目录 (下面所有数据/产物路径都相对它解析)
#
# 支持的环境变量覆盖 (优先级更高, 用于临时切换):
#   DUCKDB_GPU_BASE_DIR     直接覆盖 base_dir
#   DUCKDB_GPU_PATHS_CONF   指定另一个配置文件路径 (C++ 测试用)
#
# 读取方式:
#   C++  : #include "gpu_paths.hpp"  ->  duckdb::gpu_paths::BaseDir() / Join("data/tpch_sf5")
#   Shell: . gpu_paths.sh            ->  $BASE_DIR
#   Py   : from gpu_paths import BASE_DIR, path
# ============================================================

base_dir=/home/yx/code/bishe/duckdb-gpu
